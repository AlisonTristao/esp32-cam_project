; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = espidf
monitor_speed = 921600
monitor_dtr = 0
monitor_rts = 0

; The board's physical flash is 4MB; see sdkconfig.defaults for the matching
; CONFIG_ESPTOOLPY_FLASHSIZE_4MB/CONFIG_PARTITION_TABLE_SINGLE_APP_LARGE pair.
; board_build.partitions has to name the SAME csv explicitly: PlatformIO's
; own board-level partition selection does not follow the sdkconfig Kconfig
; choice on its own, and silently falls back to the small 1MB-app table
; otherwise (checkprogsize then fails at "greater than maximum allowed
; (1048576 bytes)" even though sdkconfig says the large table is selected).
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions_singleapp_large.csv

; TinyShell carries ShellLineEditor, the server-side line editor
; TerminalResponder uses to give TraceView's terminal a shell on this
; device. Pinned to a tag, never a branch -- same reasoning as bally_OS and
; bally_dongle's own pin (components/btp/CMakeLists.txt has the matching
; note for why BTP itself is NOT here as a lib_deps entry).
lib_deps =
    https://github.com/AlisonTristao/TinyShell.git#v1.4.0

build_flags =
    -std=gnu++2a
    -fexceptions
    ; The project's own include/ (bally_channels.h) is not on a lib/*'s
    ; compile include path by default under PlatformIO's LDF -- same reason
    ; bally_OS's platformio.ini adds this.
    -I include
    ; The dongle this firmware talks to (same MAC_ADDR bally_OS's own
    ; platformio.ini uses) -- both configureIdentity()'s dongle_source_id_
    ; derivation and the ESP-NOW peer registration in main.cpp read this.
    -D MAC_ADDR=0xDC,0xDA,0x0C,0x30,0xAA,0x5C
    ; TEMPORARY, bench-only: no SD card / bally.key provisioned yet. Falls
    ; back to scripts/gen_dev_key.py's embedded test key (password "alison")
    ; when the SD card does not mount. Remove this flag (and the
    ; DEV_EMBEDDED_KEY_L block in main.cpp) once a real card is provisioned.
    -D DEV_EMBEDDED_KEY_L

build_unflags =
    -fno-exceptions

extra_scripts =
    pre:scripts/gen_dev_key.py
